<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simulado ENEM — EducaEnem</title>

   <style>
   /* ==========================================================================
      SIMULADO EXPRESS ENEM — Cyber Prism UI (futurista, sem azul)
      ========================================================================== */
   @import url("https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Space+Grotesk:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap");

   * { box-sizing: border-box; }

   body {
     font-family: "Space Grotesk", "Segoe UI", system-ui, sans-serif;
     background-color: #f7f8fc;
     color: #101828;
     line-height: 1.6;
     margin: 0;
     padding: 20px;
     display: flex;
     justify-content: center;
     background-image:
       radial-gradient(ellipse 80% 50% at 50% -10%, rgba(167, 139, 250, 0.14), transparent),
       radial-gradient(ellipse 60% 40% at 90% 110%, rgba(255, 46, 151, 0.1), transparent),
       linear-gradient(rgba(15, 23, 42, 0.045) 1px, transparent 1px),
       linear-gradient(90deg, rgba(15, 23, 42, 0.045) 1px, transparent 1px);
     background-size: 100% 100%, 100% 100%, 42px 42px, 42px 42px;
     background-attachment: fixed;
   }

   .container { max-width: 760px; width: 100%; }

   header { text-align: center; margin-bottom: 30px; }

   header h1 {
     font-family: "Orbitron", sans-serif;
     color: #101828;
     margin-bottom: 8px;
     text-transform: uppercase;
     letter-spacing: 0.05em;
     font-size: clamp(1.35rem, 3vw, 1.85rem);
   }

   header h1::after {
     content: "";
     display: block;
     width: 120px;
     height: 3px;
     margin: 12px auto 0;
     border-radius: 999px;
     background: linear-gradient(90deg, #b8ff4d, #a78bfa, #ff2e97);
     box-shadow: 0 0 14px rgba(184, 255, 77, 0.45);
   }

   header p {
     font-family: "JetBrains Mono", monospace;
     background: rgba(15, 23, 42, 0.06);
     display: inline-block;
     padding: 5px 14px;
     border-radius: 999px;
     font-size: 0.78rem;
     font-weight: 600;
     color: #153502;
     border: 1px solid rgba(63, 125, 10, 0.4);
     letter-spacing: 0.08em;
   }

   .pergunta-box {
     background: rgba(15, 23, 42, 0.04);
     backdrop-filter: blur(16px);
     padding: 28px;
     border-radius: 20px;
     box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.18);
     margin-bottom: 25px;
     border-left: 4px solid #a78bfa;
     border-top: 1px solid rgba(15, 23, 42, 0.1);
     border-right: 1px solid rgba(15, 23, 42, 0.1);
     border-bottom: 1px solid rgba(15, 23, 42, 0.1);
     position: relative;
   }

   .pergunta-box::before {
     content: "▍";
     color: #6d28d9;
     text-shadow: 0 0 12px rgba(167, 139, 250, 0.6);
   }

   .pergunta-box p { font-size: 1.1rem; font-weight: 500; color: #101828; }

   .opcoes { display: flex; flex-direction: column; gap: 15px; }

   .opcao-btn {
     background: rgba(15, 23, 42, 0.03);
     border: 1.5px solid rgba(15, 23, 42, 0.1);
     border-radius: 14px;
     padding: 16px;
     text-align: left;
     font-size: 1rem;
     font-family: "Space Grotesk", sans-serif;
     color: #101828;
     cursor: pointer;
     transition: all 0.22s cubic-bezier(0.4, 0, 0.2, 1);
     display: flex;
     align-items: center;
     gap: 15px;
     width: 100%;
   }

   .opcao-btn:hover:not(:disabled) {
     border-color: rgba(63, 125, 10, 0.55);
     background-color: rgba(184, 255, 77, 0.07);
   }

   .opcao-btn:disabled { opacity: 0.7; cursor: default; }

   .opcao-btn .letra {
     background: rgba(15, 23, 42, 0.06);
     border: 1px solid rgba(15, 23, 42, 0.1);
     color: #242e3d;
     font-family: "Orbitron", sans-serif;
     font-weight: 700;
     width: 34px;
     height: 34px;
     display: flex;
     align-items: center;
     justify-content: center;
     border-radius: 8px;
     flex-shrink: 0;
     font-size: 0.85rem;
   }

   .btn-voltar {
     display: block;
     text-align: center;
     margin-top: 30px;
     color: #242e3d;
     text-decoration: none;
     font-weight: 600;
     font-family: "JetBrains Mono", monospace;
     text-transform: uppercase;
     letter-spacing: 0.08em;
     font-size: 0.82rem;
   }

   .btn-voltar:hover { color: #153502; text-decoration: none; }

   /* Caixa do simulado embutida em outras páginas */
   #simulado-container {
     background-color: rgba(15, 23, 42, 0.04);
     backdrop-filter: blur(16px);
     border: 1px solid rgba(15, 23, 42, 0.1);
     border-radius: 20px;
     padding: 30px;
     box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.18);
     max-width: 800px;
     margin: 20px auto;
   }

   .enunciado-box {
     margin-bottom: 20px;
     font-size: 1.1rem;
     color: #101828;
     background: rgba(15, 23, 42, 0.04);
     padding: 15px;
     border-radius: 10px;
   }

   /* Botão "próxima" gerado pelo JS */
   .opcoes + button,
   .container > button {
     background: linear-gradient(135deg, #a78bfa, #ff2e97);
     color: #fff;
     border: 1px solid rgba(167, 139, 250, 0.5);
     padding: 0.9rem 1.8rem;
     border-radius: 14px;
     font-family: "JetBrains Mono", monospace;
     font-weight: 600;
     text-transform: uppercase;
     letter-spacing: 0.06em;
     cursor: pointer;
     box-shadow: 0 0 18px rgba(167, 139, 250, 0.35);
     transition: all 0.22s;
     margin-top: 20px;
   }
   .opcoes + button:hover,
   .container > button:hover { filter: brightness(1.08); box-shadow: 0 0 26px rgba(255, 46, 151, 0.45); }

   /* ---------- Links do topo ---------- */
   .topo-links {
     display: flex;
     gap: 0.6rem;
     flex-wrap: wrap;
     justify-content: center;
     margin-bottom: 22px;
   }
   .topo-links a {
     color: #242e3d;
     text-decoration: none;
     font-size: 0.8rem;
     font-weight: 600;
     font-family: "JetBrains Mono", monospace;
     text-transform: uppercase;
     letter-spacing: 0.06em;
     padding: 0.4rem 0.85rem;
     border: 1px solid rgba(15, 23, 42, 0.1);
     border-radius: 999px;
     background: rgba(15, 23, 42, 0.03);
     transition: all 0.22s;
   }
   .topo-links a:hover {
     color: #153502;
     border-color: rgba(63, 125, 10, 0.55);
     text-decoration: none;
   }

   /* ---------- Painel de configuração ---------- */
   .barra-simulado {
     background: rgba(15, 23, 42, 0.04);
     backdrop-filter: blur(16px);
     border: 1px solid rgba(15, 23, 42, 0.1);
     border-radius: 20px;
     padding: 26px;
     display: grid;
     grid-template-columns: 1fr 1fr;
     gap: 1rem;
     align-items: end;
   }
   @media (max-width: 560px) { .barra-simulado { grid-template-columns: 1fr; } }

   .campo { display: flex; flex-direction: column; gap: 0.4rem; }
   .campo label {
     font-size: 0.74rem;
     font-weight: 600;
     color: #242e3d;
     text-transform: uppercase;
     letter-spacing: 0.14em;
     font-family: "JetBrains Mono", monospace;
   }
   .campo select {
     width: 100%;
     padding: 0.75rem 0.9rem;
     border: 1px solid rgba(15, 23, 42, 0.12);
     border-radius: 14px;
     background: rgba(15, 23, 42, 0.04);
     color: #101828;
     font-family: "Space Grotesk", sans-serif;
     transition: all 0.22s;
   }
   .campo select:focus {
     outline: none;
     border-color: #3f7d0a;
     box-shadow: 0 0 0 3px rgba(63, 125, 10, 0.22);
   }

   #btn-iniciar {
     grid-column: 1 / -1;
     background: linear-gradient(135deg, #b8ff4d, #9be12e);
     color: #05050a;
     border: 1px solid rgba(63, 125, 10, 0.6);
     padding: 0.95rem 1.6rem;
     border-radius: 14px;
     font-family: "JetBrains Mono", monospace;
     font-weight: 700;
     font-size: 0.95rem;
     text-transform: uppercase;
     letter-spacing: 0.06em;
     cursor: pointer;
     box-shadow: 0 0 18px rgba(184, 255, 77, 0.35);
     transition: all 0.22s;
   }
   #btn-iniciar:hover { filter: brightness(1.06); box-shadow: 0 0 26px rgba(184, 255, 77, 0.55); }

   /* ---------- Correção (classes aplicadas pelo JS) ---------- */
   .opcao-btn.certa {
     border-color: #4ade80;
     background: rgba(74, 222, 128, 0.14);
     opacity: 1;
   }
   .opcao-btn.errada {
     border-color: #fb7185;
     background: rgba(251, 113, 133, 0.14);
     opacity: 1;
   }

   /* ---------- Comentário revelado ---------- */
   .revelar-comentario {
     margin-top: 16px;
     border: 1px solid rgba(74, 222, 128, 0.4);
     background: rgba(74, 222, 128, 0.1);
     border-radius: 14px;
     padding: 14px 16px;
     font-size: 0.9rem;
     line-height: 1.7;
     color: #101828;
   }
   .revelar-comentario strong {
     display: block;
     color: #153502;
     font-family: "Orbitron", sans-serif;
     font-size: 0.78rem;
     text-transform: uppercase;
     letter-spacing: 0.1em;
     margin-bottom: 6px;
   }

   /* ---------- Resultado final ---------- */
   .resultado {
     background: rgba(15, 23, 42, 0.04);
     backdrop-filter: blur(16px);
     border: 1px solid rgba(167, 139, 250, 0.4);
     border-radius: 20px;
     padding: 30px;
     text-align: center;
     box-shadow: 0 12px 32px -12px rgba(15, 23, 42, 0.18);
   }
   .resultado h2 {
     font-family: "Orbitron", sans-serif;
     text-transform: uppercase;
     letter-spacing: 0.04em;
     color: #101828;
     margin-bottom: 12px;
   }
   .resultado p { color: #242e3d; }
   </style>

  <body>
    <div class="container">
      <header>
        <p>Carregando simulado...</p>
        <h1>Simulado Express ENEM 📝</h1>
      </header>

      <div class="topo-links">
        <a href="index.html">🏠 Página do curso</a>
        <a href="index.html#disciplinas">📚 Disciplinas</a>
        <a href="index.html#aulas">🎥 Aulas ao vivo</a>
      </div>

      <div class="barra-simulado" id="barra-simulado">
        <div class="campo">
          <label for="sel-filtro">Disciplina</label>
          <select id="sel-filtro">
            <option value="">Todas as disciplinas</option>
          </select>
        </div>
        <div class="campo">
          <label for="sel-qtd">Nº de questões</label>
          <select id="sel-qtd">
            <option value="10">10 questões (rápido)</option>
            <option value="20" selected>20 questões</option>
            <option value="35">35 questões</option>
            <option value="50">50 questões</option>
            <option value="0">Todas as disponíveis</option>
          </select>
        </div>
        <button id="btn-iniciar">▶ Iniciar simulado</button>
      </div>

      <main>
        <div id="area-questao" style="display: none">
          <div class="pergunta-box">
            <p id="enunciado">Carregando pergunta...</p>
          </div>
          <div class="opcoes" id="container-opcoes"></div>
        </div>
        <div id="area-resultado" style="display: none">
          <div class="resultado" id="resultado"></div>
        </div>
      </main>

      <footer>
        <a href="index.html" class="btn-voltar"
          >⬅️ Voltar para a página do curso</a
        >
      </footer>
    </div>

    <!-- SISTEMA DO SIMULADO EM JAVASCRIPT -->
    <script src="js/simulado-questoes.js"></script>
    <script>
      const bancoCompleto = window.SIMULADO_QUESTOES || [];

      const txtContador = document.querySelector("header p");
      const txtEnunciado = document.getElementById("enunciado");
      const boxOpcoes = document.getElementById("container-opcoes");
      const areaQuestao = document.getElementById("area-questao");
      const areaResultado = document.getElementById("area-resultado");
      const letras = ["A", "B", "C", "D", "E"];

      let bancoQuestoes = [];
      let questaoAtual = 0;
      let pontuacao = 0;
      let respondidas = 0;

      /* ---------- monta o seletor de disciplinas ---------- */
      const disciplinas = [...new Set(bancoCompleto.map((q) => q.disciplina))].sort();
      const selFiltro = document.getElementById("sel-filtro");
      disciplinas.forEach((d) => {
        const opt = document.createElement("option");
        opt.value = d;
        opt.textContent = d;
        selFiltro.appendChild(opt);
      });

      selFiltro.addEventListener("change", () => {
        const qtd = bancoCompleto.filter(
          (q) => !selFiltro.value || q.disciplina === selFiltro.value
        ).length;
        document.getElementById("btn-iniciar").textContent =
          "▶ Iniciar (" + qtd + " questões)";
      });
      selFiltro.dispatchEvent(new Event("change"));

      /* ---------- prepara a prova escolhida ---------- */
      document.getElementById("btn-iniciar").addEventListener("click", () => {
        let base = bancoCompleto.filter(
          (q) => !selFiltro.value || q.disciplina === selFiltro.value
        );
        const limite = Number(document.getElementById("sel-qtd").value);
        if (limite > 0 && base.length > limite) {
          base = base.slice().sort(() => Math.random() - 0.5).slice(0, limite);
        } else {
          base = base.slice().sort(() => Math.random() - 0.5);
        }
        bancoQuestoes = base;
        questaoAtual = 0;
        pontuacao = 0;
        respondidas = 0;
        document.getElementById("barra-simulado").style.display = "none";
        document.querySelector(".topo-links").style.display = "none";
        areaQuestao.style.display = "block";
        carregarQuestao();
      });

      /* ---------- fluxo da questão ---------- */
      function carregarQuestao() {
        const q = bancoQuestoes[questaoAtual];
        txtContador.innerText =
          "Questão " + (questaoAtual + 1) + " de " + bancoQuestoes.length + " — " + q.disciplina;
        txtEnunciado.innerHTML =
          "<strong>(" + q.disciplina + ")</strong> " + q.enunciado;
        boxOpcoes.innerHTML = "";

        q.alternativas.forEach((alternativa, indice) => {
          const botao = document.createElement("button");
          botao.className = "opcao-btn";
          botao.innerHTML =
            '<span class="letra">' +
            letras[indice] +
            '</span><span class="texto-alt">' +
            alternativa +
            "</span>";
          botao.addEventListener("click", () =>
            verificarResposta(indice, botao, q)
          );
          boxOpcoes.appendChild(botao);
        });
      }

      function verificarResposta(indiceSelecionado, botaoClicado, q) {
        const todosBotoes = document.querySelectorAll(".opcao-btn");
        todosBotoes.forEach((btn) => (btn.disabled = true));

        if (indiceSelecionado === q.correta) {
          botaoClicado.classList.add("certa");
          pontuacao++;
        } else {
          botaoClicado.classList.add("errada");
          todosBotoes[q.correta].classList.add("certa");
        }
        respondidas++;

        if (q.comentario) {
          const box = document.createElement("div");
          box.className = "revelar-comentario";
          box.innerHTML =
            "<strong>Comentário do professor</strong>" + q.comentario;
          boxOpcoes.appendChild(box);
        }

        setTimeout(() => {
          const btnProxima = document.createElement("button");
          btnProxima.className = "btn-avancar";
          btnProxima.innerText =
            questaoAtual < bancoQuestoes.length - 1
              ? "Próxima Questão ➡️"
              : "Ver Resultado Final 🏆";
          btnProxima.addEventListener("click", () => {
            questaoAtual++;
            if (questaoAtual < bancoQuestoes.length) {
              carregarQuestao();
            } else {
              exibirResultadoFinal();
            }
          });
          boxOpcoes.appendChild(btnProxima);
        }, 900);
      }

      /* ---------- resultado ---------- */
      function exibirResultadoFinal() {
        txtContador.innerText = "Simulado finalizado!";
        txtEnunciado.innerHTML = "<strong>Desempenho</strong> confira seu resultado abaixo.";
        boxOpcoes.innerHTML = "";
        areaQuestao.style.display = "none";
        areaResultado.style.display = "block";

        const perc = Math.round((pontuacao / bancoQuestoes.length) * 100);
        let feedback;
        if (perc === 100) feedback = "Gabaritou! Desempenho excepcional — mantenha o ritmo. 🔥";
        else if (perc >= 70) feedback = "Muito bom! Você domina a maior parte do conteúdo. Continue revisando os pontos que errou. 🚀";
        else if (perc >= 50) feedback = "Caminho certo. Volte aos textos de apoio das disciplinas que teve mais erro e refaça as questões. 💪";
        else feedback = "Não desanime! Reveja a teoria com o apoio dos textos e do Professor Virtual, depois tente novamente. 💪";

        document.getElementById("resultado").innerHTML =
          "<h2>Fim do simulado</h2>" +
          '<p class="placar">' + pontuacao + " / " + bancoQuestoes.length + " · " + perc + "%</p>" +
          "<p>" + feedback + "</p>" +
          '<div class="acoes-fim">' +
          '<button class="btn-refazer" onclick="window.location.reload()">Refazer simulado</button>' +
          '<a class="btn-voltar-curso" href="index.html#/painel">Voltar ao curso</a>' +
          "</div>";
      }

      /* ---------- estado inicial ---------- */
      document.getElementById("btn-iniciar").textContent =
        "▶ Iniciar (" + bancoCompleto.length + " questões)";
      txtContador.innerText =
        bancoCompleto.length + " questões disponíveis · escolha e comece";
    </script>
  </body>
</html>
